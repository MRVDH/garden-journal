# Garden Companion species dataset.
#
# Licensed CC BY-SA 4.0, see the LICENSE file next to this one. That is a
# different licence from the code in this repository, which is MIT, so check it
# before copying this file somewhere else.
#
# One record per plant, keyed on (genus, species). Windows are inline, and `care`
# holds work that runs for a season rather than falling on a date.
# when.start / when.end are quoted "MM-DD" strings on purpose: PyYAML is YAML 1.1,
# so bare dates and unquoted no/yes/on/off would parse as the wrong type. The
# schema is the dataclasses in ../models.py, which scripts/validate.py checks
# this file against.
#
# Every row cites the Dutch page its timing comes from. Where sources disagree,
# the safer window wins: for a plant that flowers on old wood, cutting too early
# costs a season's flowers, so a later date is the lower-risk error.
#
# Photos are linked, never copied. Each is a freely licensed Wikimedia Commons
# file addressed through Special:FilePath, which follows the file wherever
# Commons stores it. Author and licence are recorded per photo; the licence on a
# photo is its own, not the dataset's.

# ---------------------------------------------------------------- Wisteria ---

- genus: Wisteria
  names:
    nl: [Blauwe regen]
    en: [Wisteria]
  source: https://groei.nl/artikel/blauweregen-snoeien-in-de-zomer
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/N2%20Wisteria4.jpg?width=600
    author: nlamore
    licence: CC BY 2.0
    page: https://commons.wikimedia.org/wiki/File:N2_Wisteria4.jpg
  windows:
    - when: { start: "07-15", end: "08-31" }
      description:
        nl: >-
          Kort na de bloei de lange zomeruitlopers in tot ongeveer vijf
          bladeren. Dit remt de groei en stuurt energie naar de bloemknoppen.
        en: >-
          After flowering, shorten this summer's whippy side shoots to about
          five leaves. This checks the growth and pushes energy into flower
          buds.
    - when: { start: "01-15", end: "02-15" }
      description:
        nl: >-
          Snoei diezelfde zijscheuten terug tot twee of drie knoppen als de
          plant kaal is, om de bloeisporen op te bouwen.
        en: >-
          Cut the same side shoots back to two or three buds while the plant is
          bare, building up the flowering spurs.

# ------------------------------------------------------------- Hydrangea -----
# No bare Hydrangea row on purpose: the four species below disagree, so the
# genus resolves as ambiguous and the add flow asks which one you have. Nothing
# declares that; it falls out of the data.

- genus: Hydrangea
  species: paniculata
  names:
    nl: [Pluimhortensia]
    en: [Panicle hydrangea]
  source: https://groei.nl/tuin/tuinonderhoud/snoeien/pluimhortensia-snoeien-stekken
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Hydrangea%20paniculata%20IMG%206629.JPG?width=600
    author: Hedwig Storch
    licence: CC BY-SA 3.0
    page: https://commons.wikimedia.org/wiki/File:Hydrangea_paniculata_IMG_6629.JPG
  windows:
    - when: { start: "03-01", end: "04-15" }
      description:
        nl: >-
          Snoei stevig terug tot een laag raamwerk voordat de groei begint. Hij
          bloeit op scheuten van dit jaar, dus een stevige voorjaarssnoei kost
          geen bloei en geeft grotere pluimen.
        en: >-
          Cut back hard to a low framework before growth starts. It flowers on
          this year's shoots, so a hard spring prune costs no bloom and gives
          larger heads.

- genus: Hydrangea
  species: arborescens
  names:
    nl: [Sneeuwbalhortensia, Annabelle]
    en: [Smooth hydrangea, Annabelle]
  source: https://groei.nl/artikel/hortensia-snoeien
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/SpringSummer2009%20226.jpg?width=600
    author: Keckler
    licence: CC BY 3.0
    page: https://commons.wikimedia.org/wiki/File:SpringSummer2009_226.jpg
  windows:
    - when: { start: "03-01", end: "04-15" }
      description:
        nl: >-
          Knip de takken terug tot even onder de uitgebloeide bloemen voordat de
          plant uitloopt. Hij bloeit op nieuw hout; laat een stevig raamwerk
          staan, want te dunne takken kunnen de zware bollen niet dragen.
        en: >-
          Cut the stems back to just below the spent flower heads before growth
          starts. It flowers on new wood; leave a sturdy framework, because thin
          stems cannot hold the heavy heads up.

- genus: Hydrangea
  species: macrophylla
  names:
    nl: [Boerenhortensia, Bolhortensia]
    en: [Bigleaf hydrangea, Mophead hydrangea]
  source: https://www.gardenersworldmagazine.nl/groene-school/snoeien/boerenhortensia-snoeien/
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Northern%20California%20H.%20macrophylla%20shrub%20in%20bloom.jpg?width=600
    author: Cinderkinder
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:Northern_California_H._macrophylla_shrub_in_bloom.jpg
  windows:
    - when: { start: "04-01", end: "04-30" }
      description:
        nl: >-
          Knip de oude bloemen weg tot op het eerste dikke knoppenpaar eronder.
          Hij bloeit op hout van vorig jaar, dus spaar de oude takken. Laat de
          uitgebloeide bloemen de winter staan: ze beschermen de knoppen, en
          snoeien in maart kost bloei als het nog nachtvorst wordt. Knip
          mogelijk de oudste takken weg om de vorm te behouden.
        en: >-
          Take the old flower heads off down to the first fat pair of buds below
          them. It flowers on last year's wood, so spare the old stems. Leave
          the spent heads on over winter to shelter those buds; pruning in March
          costs flowers if a night frost follows. Take out the oldest stems where
          you need to, to keep its shape.

- genus: Hydrangea
  species: aspera
  synonyms: [Hydrangea sargentiana]
  names:
    nl: [Fluweelhortensia]
    en: [Rough-leaved hydrangea]
  source: https://nl-nl.bakker.com/blogs/snoeien/snoeien-de-fluweelhortensia
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Azores%20-%20Hydrangea%20aspera.jpg?width=600
    author: P. Hughes
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:Azores_-_Hydrangea_aspera.jpg
  windows:
    - when: { start: "04-01", end: "04-30" }
      description:
        nl: >-
          Haal alleen de uitgebloeide bloemen en dood of kruisend hout weg. Snoei
          hem niet terug om hem kleiner te houden: hij bloeit op ouder hout en
          een flinke snoei kost een jaar bloei. Dit is de uitzondering die niet
          in vorm gesnoeid wordt.
        en: >-
          Remove only the spent flower heads and any dead or crossing wood. Do
          not cut it back to keep it small: it flowers on older wood and a hard
          prune costs a year's flowers. This is the one that is not shaped.

# -------------------------------------------------------------- Perennials ---

- genus: Salvia
  species: nemorosa
  names:
    nl: [Bossalie]
    en: [Woodland sage]
  source: https://www.gardenersworldmagazine.nl/groene-school/snoeien/salie-snoeien/
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/00%201833%20Hain-Salbei%20(Salvia%20nemorosa).jpg?width=600
    author: W. Bulach
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:00_1833_Hain-Salbei_(Salvia_nemorosa).jpg
  windows:
    - when: { start: "04-01", end: "05-15" }
      description:
        nl: >-
          Knip het oude gewas tot bij de grond weg zodra je onderaan nieuwe
          scheuten ziet. Het blijft de winter staan voor structuur en om de
          kroon te beschermen, dus dit is de eerste snoei van het jaar.
        en: >-
          Cut last year's growth back to the base once new shoots show at the
          bottom. It stands through winter for structure and to protect the
          crown, so this is the first cut of the year.
    - when: { start: "06-15", end: "07-15" }
      description:
        nl: >-
          Snoei na de eerste bloei terug tot ongeveer tien centimeter boven de
          grond. Dat levert een tweede bloei later in de zomer.
        en: >-
          After the first flush, cut back to about ten centimetres above the
          ground. That buys a second flowering later in the summer.

- genus: Leucanthemum
  species: vulgare
  synonyms: [Chrysanthemum leucanthemum]
  names:
    nl: [Gewone margriet, Margriet]
    en: [Oxeye daisy]
  source: https://tuiniertijd.nl/margriet-snoeien/
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Leucanthemum%20vulgare%20%27Filigran%27%20Flower%202200px.jpg?width=600
    author: Derek Ramsey (Ram-Man), co-attribution to the Chanticleer Garden
    licence: CC BY-SA 3.0
    page: https://commons.wikimedia.org/wiki/File:Leucanthemum_vulgare_%27Filigran%27_Flower_2200px.jpg
  windows:
    - when: { start: "03-01", end: "03-31" }
      description:
        nl: >-
          Knip het oude gewas tot bij de grond weg voordat de plant knoppen
          aanzet. Vroeg in het voorjaar, zodra de zwaarste vorst voorbij is.
        en: >-
          Cut last year's growth back to the base before the plant sets buds.
          Early in spring, once the hardest frost has passed.
    - when: { start: "07-01", end: "07-15" }
      description:
        nl: >-
          Snoei na de eerste bloeigolf terug tot vijftien à twintig centimeter.
          Houd de grond vochtig; na vier of vijf weken komen er nieuwe
          bloemstelen voor een tweede bloei.
        en: >-
          Once the first flush is over, cut back to fifteen or twenty
          centimetres. Keep the soil moist and new flower stems follow in four
          or five weeks for a second flowering.

# ------------------------------------------------------- Evergreen hedging ---
# These four share one window block, copied verbatim, so a later deduplication
# stays mechanical. They are all broadleaf evergreens sheared twice in the
# growing season, which is why "laurier" (Prunus laurocerasus and Laurus
# nobilis) does not have to be disambiguated: both answers are the same.

- genus: Ilex
  species: crenata
  names:
    nl: [Japanse hulst]
    en: [Japanese holly, Box-leaved holly]
  source: https://www.ilexcrenata.nl/blog/ilex-crenata-snoeien/
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Ilex%20Crenata2.jpg?width=600
    author: Raul654
    licence: CC BY-SA 3.0
    page: https://commons.wikimedia.org/wiki/File:Ilex_Crenata2.jpg
  windows:
    - when: { start: "05-15", end: "06-15" }
      description:
        nl: >-
          Scheer voor het eerst als de nieuwe groei op gang is. Doe het op een
          bewolkte dag, anders verbranden de gesneden bladranden in de zon.
        en: >-
          Shear for the first time once the new growth is running. Pick an
          overcast day, or the cut leaf edges scorch in the sun.
    - when: { start: "08-15", end: "09-15" }
      description:
        nl: >-
          Scheer een tweede keer in de nazomer, zodat de wonden dichten voor de
          winter. Snoei niet later: jonge scheuten bevriezen dan.
        en: >-
          Shear a second time in late summer so the cuts close before winter. Do
          not trim later than this; soft new shoots would freeze.

- genus: Ligustrum
  names:
    nl: [Liguster]
    en: [Privet]
  source: https://www.gardenersworldmagazine.nl/groene-school/snoeien/liguster-snoeien/
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Noordwijk%20-%20Haagliguster%20(Ligustrum%20ovalifolium).jpg?width=600
    author: Rudolphous
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:Noordwijk_-_Haagliguster_(Ligustrum_ovalifolium).jpg
  windows:
    - when: { start: "05-15", end: "06-15" }
      description:
        nl: >-
          Scheer voor het eerst als de nieuwe groei op gang is. Doe het op een
          bewolkte dag, anders verbranden de gesneden bladranden in de zon.
        en: >-
          Shear for the first time once the new growth is running. Pick an
          overcast day, or the cut leaf edges scorch in the sun.
    - when: { start: "08-15", end: "09-15" }
      description:
        nl: >-
          Scheer een tweede keer in de nazomer, zodat de wonden dichten voor de
          winter. Snoei niet later: jonge scheuten bevriezen dan.
        en: >-
          Shear a second time in late summer so the cuts close before winter. Do
          not trim later than this; soft new shoots would freeze.

# A clipped ball rather than a hedge, and cut back harder in spring than the
# hedge is, which is why it is its own row. The bare Ligustrum row above still
# answers on its own, so typing the genus is not turned into a question.
- genus: Ligustrum
  species: delavayanum
  synonyms: [Ligustrum jonandrum]
  names:
    nl: [Bolliguster, Bolboom liguster]
    en: [Delavay privet]
  source: https://www.directplant.nl/bolliguster-ligustrum-delavayanum.html
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Ligustrum%20delavayanum%2001.jpg?width=600
    author: FreCha
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:Ligustrum_delavayanum_01.jpg
  windows:
    - when: { start: "04-01", end: "05-15" }
      description:
        nl: >-
          Snoei in het voorjaar terug tot dicht op het raamwerk, tot ongeveer
          tien centimeter van de stam, zodat de bol weer strak staat. Wacht tot
          het niet meer vriest; hij is wintergroen en verdraagt vormsnoei goed.
        en: >-
          In spring, cut back close to the framework, to about ten centimetres
          from the stem, so the ball reads as a ball again. Wait until the frosts
          are done; it is evergreen and takes shaping well.
    - when: { start: "09-01", end: "09-30" }
      description:
        nl: >-
          Snoei in het najaar eventueel een tweede keer, maar minder diep: alleen
          bijwerken wat uit de vorm loopt.
        en: >-
          Optionally cut a second time in autumn, but less deep: only tidy what
          has grown out of shape.

- genus: Prunus
  species: laurocerasus
  synonyms: [Laurocerasus officinalis]
  names:
    nl: [Laurierkers, Laurier]
    en: [Cherry laurel]
  source: https://www.directplant.nl/tuintips/laurier-snoeien/
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Ruhland,%20Goethestr.%20bei%20Lange%20Str.%208a,%20Lorbeerkirschen-Hecke,%20Vorwinter,%2001.jpg?width=600
    author: Wilhelm Zimmerling PAR
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:Ruhland,_Goethestr._bei_Lange_Str._8a,_Lorbeerkirschen-Hecke,_Vorwinter,_01.jpg
  windows:
    - when: { start: "03-15", end: "04-15" }
      description:
        nl: >-
          Beste snoeien met een snoeischaar. Zo worden de bladeren niet
          beschadigd en blijft de hele haag er fraai uitzien. Net voor de takken
          uit gaan lopen. Verwijder in het voorjaar ook dode takken en takken
          met bruine bladeren.
        en: >-
          Best cut with secateurs. That leaves the leaves undamaged and keeps the
          whole hedge looking good. Do it just before the shoots break. In spring,
          take out dead stems and stems with brown leaves as well.
    - when: { start: "08-15", end: "09-15" }
      description:
        nl: >-
          Scheer een tweede keer in de nazomer, zodat de wonden dichten voor de
          winter. Snoei niet later: jonge scheuten bevriezen dan.
        en: >-
          Shear a second time in late summer so the cuts close before winter. Do
          not trim later than this; soft new shoots would freeze.

