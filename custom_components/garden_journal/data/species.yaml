# A clipped ball rather than a hedge, and cut back harder in spring than the
# hedge is, which is why it is its own row. The bare Ligustrum row above still
# answers on its own, so typing the genus is not turned into a question.
- genus: Ligustrum
  species: delavayanum
  synonyms: [Ligustrum jonandrum]
  names:
    nl: [Bolliguster, Bolboom liguster]
    en: [Delavay privet]
  source: https://www.directplant.nl/bolliguster-ligustrum-delavayanum.html
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Ligustrum%20delavayanum%2001.jpg?width=600
    author: FreCha
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:Ligustrum_delavayanum_01.jpg
  windows:
    - when: { start: "04-01", end: "05-15" }
      description:
        nl: >-
          Snoei in het voorjaar terug tot dicht op het raamwerk, tot ongeveer
          tien centimeter van de stam, zodat de bol weer strak staat. Wacht tot
          het niet meer vriest; hij is wintergroen en verdraagt vormsnoei goed.
        en: >-
          In spring, cut back close to the framework, to about ten centimetres
          from the stem, so the ball reads as a ball again. Wait until the frosts
          are done; it is evergreen and takes shaping well.
    - when: { start: "09-01", end: "09-30" }
      description:
        nl: >-
          Snoei in het najaar eventueel een tweede keer, maar minder diep: alleen
          bijwerken wat uit de vorm loopt.
        en: >-
          Optionally cut a second time in autumn, but less deep: only tidy what
          has grown out of shape.

- genus: Prunus
  species: laurocerasus
  synonyms: [Laurocerasus officinalis]
  names:
    nl: [Laurierkers, Laurier]
    en: [Cherry laurel]
  source: https://www.directplant.nl/tuintips/laurier-snoeien/
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Ruhland,%20Goethestr.%20bei%20Lange%20Str.%208a,%20Lorbeerkirschen-Hecke,%20Vorwinter,%2001.jpg?width=600
    author: Wilhelm Zimmerling PAR
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:Ruhland,_Goethestr._bei_Lange_Str._8a,_Lorbeerkirschen-Hecke,_Vorwinter,_01.jpg
  windows:
    - when: { start: "03-15", end: "04-15" }
      description:
        nl: >-
          Beste snoeien met een snoeischaar. Zo worden de bladeren niet
          beschadigd en blijft de hele haag er fraai uitzien. Net voor de takken
          uit gaan lopen. Snoei terug tot in de vorm die je wil en houd de haag
          onderaan ongeveer tien centimeter breder dan bovenaan, dan valt er
          genoeg licht op de onderste takken. Verwijder in het voorjaar ook dode
          takken en takken met bruine bladeren.
        en: >-
          Best cut with secateurs. That leaves the leaves undamaged and keeps the
          whole hedge looking good. Do it just before the shoots break. Cut back
          into the shape you want and keep the hedge about ten centimetres wider
          at the bottom than at the top, so enough light falls on the lower
          branches. In spring, take out dead stems and stems with brown leaves as
          well.
    - when: { start: "08-15", end: "09-15" }
      description:
        nl: >-
          Scheer een tweede keer in de nazomer terug tot dezelfde vorm, zodat de
          wonden dichten voor de winter. Snoei niet later: jonge scheuten
          bevriezen dan.
        en: >-
          Shear a second time in late summer, back to the same shape, so the cuts
          close before winter. Do not trim later than this; soft new shoots would
          freeze.

