# ------------------------------------------------------------------ Others ---

- genus: Lavandula
  names:
    nl: [Lavendel]
    en: [Lavender]
  source: https://groei.nl/artikel/lavendel-snoeien
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Lavandula-angustifolia-flowering.JPG?width=600
    author: Sten Porse
    licence: CC BY-SA 3.0
    page: https://commons.wikimedia.org/wiki/File:Lavandula-angustifolia-flowering.JPG
  windows:
    - when: { start: "03-25", end: "04-10" }
      description:
        nl: >-
          Geef een lichte vormsnoei en haal winterschade weg. Snoei nooit in het
          kale, verhoute hout: daar loopt lavendel niet meer uit. Blijf altijd
          boven de laagste groene scheuten.
        en: >-
          Give it a light shaping and take out any winter damage. Never cut into
          the bare, woody base: lavender does not reshoot from there. Always
          stay above the lowest green shoots.
    - when: { start: "08-15", end: "09-15" }
      description:
        nl: >-
          Dit is de hoofdsnoei, direct na de bloei. Knip de uitgebloeide stelen
          eraf met twee à vijf centimeter van de bebladerde scheuten eronder. Zo
          blijft de plant compact in plaats van open te vallen.
        en: >-
          This is the main prune, straight after flowering. Take off the spent
          flower stems with two to five centimetres of the leafy growth below
          them. That keeps the plant compact instead of letting it fall open.

- genus: Verbena
  species: bonariensis
  names:
    nl: [Stijf ijzerhard, IJzerhard]
    en: [Purpletop vervain]
  source: https://www.gardenersworldmagazine.nl/groene-school/snoeien/verbena-snoeien/
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Verbena%20bonariensis.jpg?width=600
    author: frank wouters
    licence: CC BY 2.0
    page: https://commons.wikimedia.org/wiki/File:Verbena_bonariensis.jpg
  windows:
    - when: { start: "03-01", end: "03-31" }
      description:
        nl: >-
          Knip de dode stelen tot op de grond terug zodra je onderaan nieuwe
          scheuten ziet. Laat ze de hele winter staan: ze beschermen de kroon
          tegen de vorst, de zaden zijn vogelvoer en zo zaait hij zichzelf uit.
        en: >-
          Cut the dead stems right down once new shoots appear at the base.
          Leave them standing all winter: they shelter the crown from frost, the
          seed feeds the birds, and it is how the plant seeds itself around.

- genus: Magnolia
  species: soulangeana
  synonyms: [Magnolia soulangiana]
  names:
    nl: [Beverboom]
    en: [Saucer magnolia]
  source: https://www.gardenersworldmagazine.nl/groene-school/snoeien/magnolia-snoeien/
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Magnolia%20x%20soulangeana%202%20(Piotr%20Kuczynski).jpg?width=600
    author: Piotr Kuczynski
    licence: CC BY-SA 3.0
    page: https://commons.wikimedia.org/wiki/File:Magnolia_x_soulangeana_2_(Piotr_Kuczynski).jpg
  windows:
    - when: { start: "07-01", end: "09-15" }
      description:
        nl: >-
          Snoei zo weinig mogelijk, en alleen in de zomer. Haal dood, beschadigd
          of kruisend hout weg en houd de sneden klein. In de winter of het
          vroege voorjaar bloedt hij en heelt de wond slecht, en in het najaar
          snoei je de knoppen voor volgend voorjaar weg.
        en: >-
          Prune as little as possible, and only in summer. Take out dead,
          damaged or crossing wood and keep the cuts small. In winter or early
          spring the sap runs and the wound heals badly, and pruning in autumn
          removes next spring's flower buds.

# -------------------------------------------------------------------- Rosa ---
# One row for roses, trained however you grow them. A shrub and a climber differ
# in what you cut rather than when: both go in the same spring window, so the
# difference is carried by the description and the genus answers on its own.
#
# The care season's dates are a reading rather than a citation. The source says to
# deadhead "het hele seizoen" without naming months; June to mid-October is the
# Dutch flowering season for a repeat bloomer, so the advice is the source's and
# the bounds are a reading of it. The window itself is cited.

- genus: Rosa
  names:
    nl: [Roos, Rozen, Klimroos]
    en: [Rose, Climbing rose]
  source: https://www.directplant.nl/tuintips/rozen-snoeien/
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Light%20magenta%20rose%20Easton%20Lodge%20Gardens%20walled%20garden%20Little%20Easton%20Essex%2002.jpg?width=600
    author: Acabashi
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:Light_magenta_rose_Easton_Lodge_Gardens_walled_garden_Little_Easton_Essex_02.jpg
  windows:
    - when: { start: "03-01", end: "03-31" }
      description:
        nl: >-
          Snoei een rozenstruik terug tot drie à vijf ogen boven de grond, tot
          een naar buiten gerichte knop, zodra de ergste vorst voorbij is. Laat
          je hem klimmen, dan is het net andersom: de lange hoofdtakken laat je
          staan en kort je een derde in, en je snoeit vooral de zijtakken; dat
          mag al vanaf februari.
        en: >-
          Cut a shrub rose back to three to five eyes above the ground, to an
          outward-facing bud, once the worst frost has passed. Grown as a
          climber it is the other way round: leave the long main stems and
          shorten them by a third, and prune the side shoots instead; that can
          start in February.
  care:
    - when: { start: "06-01", end: "10-15" }
      description:
        nl: >-
          Knip uitgebloeide bloemen direct weg, tot op het eerste blad met vijf
          blaadjes in plaats van drie: daaruit komt de volgende knop. Dat houdt
          hem het hele seizoen doorbloeien.
        en: >-
          Deadhead spent flowers as they go over, cutting back to the first leaf
          with five leaflets rather than three: that is where the next bud comes
          from. It keeps a repeat-flowering rose going all season.

# ---------------------------------------------------------------- Climbers ---
# Clematis is the second genus whose species disagree, and the disagreement is
# the point: viticella flowers on new wood and goes to the ground in late winter,
# montana flowers on old wood and is only tidied once it has finished. So typing
# "clematis" asks which one you have, the same way "hortensia" does.

- genus: Clematis
  species: viticella
  names:
    nl: [Italiaanse clematis, Clematis]
    en: [Italian clematis, Viticella clematis]
  source: https://groei.nl/artikel/clematis-snoeien
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Clematis%20viticella%20-%202024-06-28.jpg?width=600
    author: Jeangagnon
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:Clematis_viticella_-_2024-06-28.jpg
  windows:
    - when: { start: "02-20", end: "03-31" }
      description:
        nl: >-
          Knip alles terug tot twintig à veertig centimeter boven de grond, tot
          net boven een gezonde knop. Wacht een vorstvrije periode af. Hij bloeit
          op hout van dit jaar, dus deze harde snoei kost geen bloei.
        en: >-
          Cut everything back to twenty or forty centimetres above the ground, to
          just above a healthy bud. Wait for a frost-free spell. It flowers on
          this year's wood, so cutting this hard costs no flowers.

- genus: Clematis
  species: montana
  names:
    nl: [Bergbosrank, Bergclematis]
    en: [Mountain clematis]
  source: https://groei.nl/artikel/clematis-snoeien
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Cl%C3%A9matite%20montana%20%27Gistar%27.JPG?width=600
    author: Vegetal45
    licence: CC BY-SA 3.0
    page: https://commons.wikimedia.org/wiki/File:Cl%C3%A9matite_montana_'Gistar'.JPG
  windows:
    - when: { start: "05-01", end: "06-30" }
      description:
        nl: >-
          Snoei direct na de bloei en haal dood en zwak hout weg. Bij een sterke
          groeier als deze haal je elke twee jaar ongeveer een kwart van de
          scheuten weg, anders wordt hij onderaan kaal. Snoei hem niet in het
          voorjaar: de bloemen zitten op hout van vorig jaar.
        en: >-
          Prune straight after flowering and take out dead and weak wood. On a
          vigorous grower like this one, remove about a quarter of the shoots
          every two years or it goes bare at the base. Do not prune it in spring:
          the flowers sit on last year's wood.

- genus: Hedera
  species: colchica
  names:
    nl: [Kaukasische klimop, Klimop]
    en: [Persian ivy]
  source: https://www.gardenersworldmagazine.nl/groene-school/snoeien/klimop-snoeien/
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Hedera%20colchica%20%27Dendroides%27%20Bluszcz%20kolchidzki%202019-04-28%2002.jpg?width=600
    author: Agnieszka Kwiecień, Nova
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:Hedera_colchica_'Dendroides'_Bluszcz_kolchidzki_2019-04-28_02.jpg
  windows:
    - when: { start: "03-01", end: "04-30" }
      description:
        nl: >-
          Knip doorschietende scheuten terug, of pak de hoofdtakken aan en haal
          de zijscheuten weg. Je mag hem gerust kort snoeien, tot je alleen het
          takkengestel nog ziet; hij kan veel hebben. Kijk eerst of er geen
          vogelnest bezet is: klimop is een veelgebruikte nestplek, dus stel de
          snoei uit als er een in zit.
        en: >-
          Cut back wayward shoots, or work on the main branches and take out the
          side shoots. You can take it back hard, until only the framework of
          branches is left; it stands a lot. Check first for an occupied bird
          nest: ivy is a favourite nesting place, so put the job off if there is
          one.
    - when: { start: "08-01", end: "09-10" }
      description:
        nl: >-
          De tweede snoei, tot begin september. Daarna niet meer: klimop bloeit
          in het najaar en die bloemen zijn voedsel voor bestuivers als de rest
          van de tuin al klaar is, en de bessen zijn winterkost voor vogels.
        en: >-
          The second cut, up to early September. Not after that: ivy flowers in
          autumn and those flowers feed pollinators once the rest of the garden
          has finished, and the berries feed birds through winter.

# -------------------------------------------------------- More perennials ---

# Iberis is cut back "na de bloei" and flowers April to June, so the fortnight is a
# reading of when that finishes rather than a date the source gives.

- genus: Iberis
  species: sempervirens
  names:
    nl: [Scheefkelk, Scheefbloem]
    en: [Evergreen candytuft]
  source: https://www.baldur-nederland.nl/onion/content/plant--und-verzorgingstips/vaste-planten/iberis
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Trauttmansdorff%20gardens%20-%20Iberis%20sempervirens%2001.jpg?width=600
    author: Syrio
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:Trauttmansdorff_gardens_-_Iberis_sempervirens_01.jpg
  windows:
    - when: { start: "06-15", end: "07-15" }
      description:
        nl: >-
          Kort hem na de bloei met een heggenschaar met een derde in. Dat houdt
          de vorm compact. Snoei niet in de herfst en in geen geval in het oude,
          verhoute hout: daar loopt hij niet meer uit.
        en: >-
          Trim it back by a third with hedge shears once it has flowered. That
          keeps the shape compact. Do not prune in autumn, and never into the
          old, woody growth: it does not reshoot from there.

- genus: Echinacea
  species: purpurea
  names:
    nl: [Rode zonnehoed, Zonnehoed]
    en: [Purple coneflower]
  source: https://www.gardenersworldmagazine.nl/groene-school/snoeien/zonnehoed-snoeien/
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Echinacea%20purpurea%20Feldanbau.jpg?width=600
    author: Burkhard Mücke
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:Echinacea_purpurea_Feldanbau.jpg
  windows:
    - when: { start: "04-01", end: "04-30" }
      description:
        nl: >-
          Knip de dode stengels tot vijf à tien centimeter boven de grond weg,
          rond half april, zodra de plant weer uitloopt. Laat ze de winter staan:
          ze beschermen de plant tegen vorst en de zaadhoofden zijn vogelvoer.
        en: >-
          Cut the dead stems back to five or ten centimetres above the ground,
          around mid-April, as soon as the plant starts into growth. Leave them
          through winter: they protect the plant from frost and the seed heads
          feed birds.

# Scabiosa's window is a reading: the source says to cut it back "eind winter" and
# names no month. The care season is cited, from the flowering months it gives.
# How low it is cut comes from two other pages, because the source cited here gives
# no height: hovenier.nl/planten/duifkruid takes the flower stems back to just above
# the base of the plant and deadheads just above a leaf, and tuindingen.nl puts the
# cut-back at a hand's breadth above the ground. It holds a basal leaf rosette
# through the winter, so it is cut to just above that rather than to the ground.

- genus: Scabiosa
  species: lucida
  names:
    nl: [Glanzend duifkruid, Duifkruid]
    en: [Shining scabious]
  source: https://www.gardenersworldmagazine.nl/planten/scabiosa-duifkruid/
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Scabiosa%20lucida%20RF.jpg?width=600
    author: Robert Flogaus-Faust
    licence: CC BY 4.0
    page: https://commons.wikimedia.org/wiki/File:Scabiosa_lucida_RF.jpg
  windows:
    - when: { start: "02-01", end: "03-15" }
      description:
        nl: >-
          Knip de plant eind winter terug tot net boven de bladrozet, ongeveer een
          handbreedte boven de grond. De rozet blijft de winter groen, dus knip
          hem niet tot op de grond. Laat de zaadhoofden tot dan staan voor de
          vogels. Wil je zaad oogsten, dan knip je hem in het najaar terug zodra
          het zaad rijp is.
        en: >-
          Cut the plant back in late winter to just above the leaf rosette, about a
          hand's breadth above the ground. The rosette stays green over winter, so
          do not cut it to the ground. Leave the seed heads standing until then for
          the birds. If you want to collect seed, cut it back in autumn once the
          seed is ripe instead.
  care:
    - when: { start: "07-01", end: "09-30" }
      description:
        nl: >-
          Knip uitgebloeide bloemen er regelmatig af, net boven het eerste blad
          onder de bloem. Dan blijft hij nieuwe knoppen maken en bloeit hij een
          stuk langer door.
        en: >-
          Take the spent flowers off regularly, cutting just above the first leaf
          below the flower. It keeps setting new buds and carries on flowering
          considerably longer.

- genus: Achillea
  species: filipendulina
  names:
    nl: [Geel duizendblad, Duizendblad]
    en: [Fernleaf yarrow]
  source: https://www.hovenier.nl/planten/asteraceae/achillea
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/00%203068%20Bl%C3%BCtenstand%20der%20Goldgarbe%20(Achillea%20filipendulina).jpg?width=600
    author: W. Bulach
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:00_3068_Bl%C3%BCtenstand_der_Goldgarbe_(Achillea_filipendulina).jpg
  windows:
    - when: { start: "03-01", end: "03-31" }
      description:
        nl: >-
          Knip dood blad en bladeren die er slordig uitzien helemaal tot aan de
          grond af, zodat de nieuwe groei ruimte krijgt.
        en: >-
          Cut dead foliage and any leaves that look untidy right back to the
          ground, so the new growth has room.
    - when: { start: "08-01", end: "09-30" }
      description:
        nl: >-
          Knip de uitgebloeide bloemstelen tot aan de grond af. Daarna loopt hij
          opnieuw uit en bloeit in het najaar nog een keer. De zaadhoofden zijn
          ook na de bloei mooi, dus laten staan mag ook.
        en: >-
          Cut the spent flower stems back to the ground. It then puts out fresh
          growth and flowers again in autumn. The seed heads look good after
          flowering too, so leaving them is also fine.

- genus: Astilbe
  species: japonica
  names:
    nl: [Pluimspirea, Prachtspirea]
    en: [Japanese astilbe]
  source: https://tuiniertijd.nl/astilbe-snoeien/
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/%E8%90%BD%E6%96%B0%E5%A9%A6%E5%B1%AC%20Astilbe%20japonica%20-%E6%B7%B1%E5%9C%B3%E8%8A%B1%E5%B1%95%20Shenzhen%20Flower%20Show%2C%20China-%20(39386513705).jpg?width=600
    author: 阿橋 HQ
    licence: CC BY-SA 2.0
    page: https://commons.wikimedia.org/wiki/File:%E8%90%BD%E6%96%B0%E5%A9%A6%E5%B1%AC_Astilbe_japonica_-%E6%B7%B1%E5%9C%B3%E8%8A%B1%E5%B1%95_Shenzhen_Flower_Show%2C_China-_(39386513705).jpg
  windows:
    - when: { start: "03-01", end: "04-30" }
      description:
        nl: >-
          Knip al het dode blad en de overgebleven stelen tot net boven de grond
          weg, vlak voordat het nieuwe blad komt. Laat de pluimen tot dan staan:
          ze geven de winter een mooi silhouet en beschermen het groeipunt tegen
          kou. Wil je ze eerder weg, dan kan dat in september.
        en: >-
          Cut all the dead foliage and the leftover stems back to just above the
          ground, right before the new leaves come. Leave the plumes until then:
          they give the winter a good silhouette and protect the crown from cold.
          If you want them gone sooner, September works.

- genus: Heuchera
  species: micrantha
  names:
    nl: [Klein purperklokje, Purperklokje]
    en: [Small-flowered alumroot]
  source: https://tuiniertijd.nl/heuchera-snoeien/
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Heuchera%20micrantha%20%60Palace%20Purple%60a2.jpg?width=600
    author: Jerzy Opioła
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:Heuchera_micrantha_%60Palace_Purple%60a2.jpg
  windows:
    - when: { start: "02-01", end: "03-31" }
      description:
        nl: >-
          Haal bruine, gescheurde en vlekkerige bladeren zo laag mogelijk weg,
          tot net boven de kroon. Wacht niet te lang: zodra het nieuwe blad komt,
          knip je dat er makkelijk mee af. In een milde winter blijft hij half
          wintergroen, dus snoei hem niet kaal.
        en: >-
          Take the brown, torn and blotchy leaves off as low as you can, to just
          above the crown. Do not leave it too late: once the new leaves are up
          you will trim those off with them. In a mild winter it stays
          semi-evergreen, so do not cut it bare.
  care:
    - when: { start: "06-01", end: "08-31" }
      description:
        nl: >-
          Knip uitgebloeide bloemstelen met een nette snede zo laag mogelijk weg.
          Dat houdt de plant compact.
        en: >-
          Cut spent flower stems off as low as you can with a clean cut. It keeps
          the plant compact.

# Platycodon's cut-back month is a reading: Dutch pages cover deadheading, staking
# and marking the spot, and none of them names a month for taking last year's stems
# off. The window sits before it breaks, which cannot cost anything, since the
# stems it removes are already dead. That it shows new shoots only in May comes
# from a second page, platycodon.net/nl, rather than from the source cited here.
# The height is a reading for the same reason and carries the same risk, which is
# none: no Dutch page gives one, and the stems being cut are dead either way.

- genus: Platycodon
  species: grandiflorus
  names:
    nl: [Ballonklokje, Ballonbloem]
    en: [Balloon flower]
  source: https://www.tuindingen.nl/blog/vaste-planten/platycodon-grandiflorus-ballonklokje
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Platycodon%20grandiflorus%20Mariesii%200zz.jpg?width=600
    author: David J. Stang
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:Platycodon_grandiflorus_Mariesii_0zz.jpg
  windows:
    - when: { start: "03-01", end: "04-15" }
      description:
        nl: >-
          Knip de dode stelen van vorig jaar tot vlak boven de grond weg voordat
          het nieuwe komt. Hij loopt laat uit en laat pas in mei nieuwe scheuten
          zien, dus zet er in het najaar een stokje bij: anders lijkt hij dood en
          spit je hem in het voorjaar per ongeluk om. Strooi na het terugknippen
          compost rond de plant.
        en: >-
          Cut last year's dead stems away to just above the ground before the new
          growth comes. It breaks late, showing new shoots only in May, so mark
          the spot in autumn: otherwise it looks dead and you dig it up in spring
          by mistake. Spread compost around the plant once you have cut it back.
  care:
    - when: { start: "06-01", end: "08-31" }
      description:
        nl: >-
          Haal uitgebloeide bloemen eruit, dan blijft hij tot laat in de zomer
          doorbloeien. De lange stelen met hun zware bloemen knikken of breken
          soms; zet ze dan vast.
        en: >-
          Take the spent flowers out and it carries on flowering into late
          summer. The long stems with their heavy flowers sometimes bend or
          snap; stake them if they do.

# ------------------------------------------------------------ More shrubs ---
# Rhododendron is the third genus that has to ask. Both are hardy garden plants
# that differ in when they are cut: maximum is a large evergreen shrub pruned late,
# after its own summer flowers, while simsii is the low evergreen garden azalea
# pruned right after its May bloom.

- genus: Rhododendron
  species: maximum
  names:
    nl: [Reuze rhododendron, Rhododendron]
    en: [Great rhododendron, Rosebay]
  source: https://groei.nl/artikel/rododendron-en-azalea-snoeien-en-verzorgen
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Rhododendron%20maximum%2001.jpg?width=600
    author: Syrio
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:Rhododendron_maximum_01.jpg
  windows:
    - when: { start: "05-25", end: "07-05" }
      description:
        nl: >-
          Snoei direct na de bloei, terug tot net boven een paar jonge zijtakjes.
          Voor de meeste rhododendrons is dat juni; deze bloeit laat, dus wacht
          tot zijn eigen bloemen voorbij zijn. Later in het seizoen zitten de
          knoppen voor volgend jaar er al. Uitgebloeide bloemen mag je laten
          zitten, dat hoeft niet.
        en: >-
          Prune straight after flowering, back to just above a pair of young side
          shoots. For most rhododendrons that is June; this one is late, so wait
          until its own flowers are over. Later in the season next year's buds are
          already set. Spent flowers can stay, there is no need to pick them off.

- genus: Rhododendron
  species: simsii
  names:
    nl: [Gentse azalea, Japanse azalea, Azalea]
    en: [Japanese azalea, Evergreen azalea]
  source: https://groenvanbijons.be/plantengids/japanse-azalea
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Rhododendron%20simsii%20%27Sachsenstern%27%20kz01.jpg?width=600
    author: Krzysztof Ziarnek, Kenraiz
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:Rhododendron_simsii_'Sachsenstern'_kz01.jpg
  windows:
    - when: { start: "05-15", end: "06-30" }
      description:
        nl: >-
          De winterharde, groenblijvende tuinazalea, niet de geforceerde
          kamerplant met dezelfde naam. Snoeien hoeft nauwelijks: hij groeit
          langzaam en blijft laag. Wil je, snoei dan spaarzaam direct na de bloei,
          die rond mei valt. Haal de uitgebloeide bloemen weg.
        en: >-
          The hardy, evergreen garden azalea, not the forced house plant that
          shares the name. It barely needs pruning: it grows slowly and stays low.
          If you do, prune sparingly right after the bloom, which falls around May.
          Take the spent flowers off.

- genus: Skimmia
  species: japonica
  names:
    nl: [Skimmia]
    en: [Japanese skimmia]
  source: https://www.gardenersworldmagazine.nl/groene-school/snoeien/skimmia-snoeien/
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Skimmia%20japonica%20RF.jpg?width=600
    author: Robert Flogaus-Faust
    licence: CC BY 4.0
    page: https://commons.wikimedia.org/wiki/File:Skimmia_japonica_RF.jpg
  windows:
    - when: { start: "04-01", end: "06-30" }
      description:
        nl: >-
          Regelmatig snoeien is niet nodig: hij groeit langzaam en blijft
          compact. Wil je toch, dan direct na de bloei. Haal dood of beschadigd
          hout weg, eventueel een kwart van de oudste dikke takken tot bij de
          voet, en de uitgebloeide bloemen. Niet in het najaar snoeien.
        en: >-
          Regular pruning is not needed: it grows slowly and stays compact. If
          you do, go straight after flowering. Take out dead or damaged wood,
          optionally a quarter of the oldest thick branches down to the base, and
          the spent flowers. Do not prune in autumn.

- genus: Euonymus
  species: fortunei
  names:
    nl: [Kardinaalsmuts]
    en: [Wintercreeper]
  source: https://tuiniertijd.nl/kardinaalsmuts-snoeien/
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Euonymus%20fortunei%20%27Emerald%20Gaiety%27%20kz02.jpg?width=600
    author: Krzysztof Ziarnek, Kenraiz
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:Euonymus_fortunei_'Emerald_Gaiety'_kz02.jpg
  windows:
    - when: { start: "03-01", end: "04-30" }
      description:
        nl: >-
          Snoei in het vroege voorjaar. Haal dood hout, beschadigde takken en
          kruisende twijgen weg en kort de nieuwe groei ongeveer een derde in voor
          de vorm. Snoei niet in strenge vorst of in de volle middagzon: verse
          snijvlakken drogen dan uit.
        en: >-
          Prune in early spring. Take out dead wood, damaged branches and
          crossing twigs, and shorten the new growth by about a third for shape.
          Do not prune in hard frost or full midday sun: fresh cuts dry out.

# The source says to apply renewal pruning without saying what that is, so the
# method comes from a second page, wanneer-snoeien.nl/blog/struik-snoeien: a third
# of the oldest, thickest branches out at the base each year, which renews the shrub
# over three years. That phased form is the one described here rather than cutting
# the whole shrub down in one go, which the same page keeps for buddleja, forsythia
# and elder.
- genus: Calycanthus
  species: floridus
  names:
    nl: [Specerijstruik]
    en: [Carolina allspice, Sweetshrub]
  source: https://yarinde.nl/products/specerijstruik-calycanthus-floridus
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Calycanthus%20floridus%20kz07.jpg?width=600
    author: Krzysztof Ziarnek, Kenraiz
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:Calycanthus_floridus_kz07.jpg
  windows:
    - when: { start: "07-15", end: "08-15" }
      description:
        nl: >-
          Snoei alleen als het niet anders kan, en dan direct na de bloei, rond
          eind juli. Later snoeien kost de bloemen van volgend jaar. Moet hij
          echt terug, pas dan verjongingssnoei toe: haal elk jaar een derde van de
          oudste, dikste takken tot aan de basis weg. Na drie jaar is hij
          vernieuwd zonder ooit kaal te hebben gestaan.
        en: >-
          Prune only if you have to, and then straight after flowering, around
          the end of July. Pruning later costs next year's flowers. If it really
          has to come back, use renewal pruning: take a third of the oldest,
          thickest branches out at the base each year. After three years it has
          renewed itself without ever having stood bare.

# Exochorda's window is a reading: the source dates the flowering to April and May
# and says to prune "na de bloei" without naming a month, so the window opens as the
# bloom ends. It closes at the end of June because the buds for next spring are set
# over the summer, which makes a late cut the error that costs a season. How far
# back is cited. That an old branch comes out down to the lowest strong young shoot,
# or to the base when there is none, comes from a second page,
# hovenier.nl/planten/rosaceae/exochorda.

- genus: Exochorda
  names:
    nl: [Parelstruik]
    en: [Pearlbush]
  source: https://tuinadvies.nl/plantengids/1366/exochorda
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Exochorda%20%C3%97%20macrantha%20%27The%20Bride%27%20kz03.jpg?width=600
    author: Krzysztof Ziarnek, Kenraiz
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:Exochorda_%C3%97_macrantha_'The_Bride'_kz03.jpg
  windows:
    - when: { start: "05-15", end: "06-30" }
      description:
        nl: >-
          Snoei licht direct na de bloei: haal de uitgebloeide takken weg en zet
          de struik weer in vorm. Neem om de twee à drie jaar de oudste takken,
          ouder dan drie jaar, met een derde terug, tot op de laagste sterke jonge
          scheut of tot de voet als die er niet is. Zo blijft hij onderaan bezet.
          Hij bloeit op hout van vorig jaar en zet de knoppen in de zomer aan, dus
          later snoeien kost de bloei van volgend voorjaar.
        en: >-
          Prune lightly straight after flowering: take out the spent branches and
          bring the shrub back into shape. Every two or three years, cut the
          oldest branches, the ones over three years old, back by a third, to the
          lowest strong young shoot or to the base if there is none. That keeps it
          furnished at the bottom. It flowers on last year's wood and sets its
          buds over the summer, so pruning later costs next spring's flowers.

# Vitex is pruned in early spring, which three Dutch pages agree on and none of
# them dates, so the fortnight is a reading. The height is cited; sources differ on
# it, offering twenty, ten to twenty and thirty to fifty centimetres, and the one
# quoted here is the middle of that. No page recommends deadheading it: it flowers
# in one late flush on this year's wood, so there is no second flush to buy, and
# the spring cut is what drives the bloom.

- genus: Vitex
  species: agnus-castus
  names:
    nl: [Kuisheidsstruik, Monnikspeper]
    en: [Chaste tree]
  source: https://groeneparadijs.nl/vitex-agnus-castus.html
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Vitex%20agnus-castus%20Niepokalanek%20pieprzowy%202020-07-31%2004.jpg?width=600
    author: Agnieszka Kwiecień, Nova
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:Vitex_agnus-castus_Niepokalanek_pieprzowy_2020-07-31_04.jpg
  windows:
    - when: { start: "03-01", end: "04-15" }
      description:
        nl: >-
          Snoei hem in het vroege voorjaar terug tot circa twintig centimeter
          boven de grond, net voordat de nieuwe groei begint; dat bevordert de
          bloei. Haal ingevroren takken helemaal weg. Hij bloeit op hout van dit
          jaar, dus deze harde snoei kost geen bloei. De uitgebloeide pluimen
          mag je laten staan: hij bloeit in één late golf, dus wegknippen levert
          geen tweede bloei op zoals bij een roos.
        en: >-
          Cut it back in early spring to about twenty centimetres above the
          ground, just before new growth starts; that encourages flowering. Take
          frost-damaged branches right out. It flowers on this year's wood, so
          cutting this hard costs no bloom. The spent flower spikes can stay: it
          flowers in one late flush, so taking them off buys no second flush the
          way it does on a rose.

# ------------------------------------------------------------------- Trees ---
# Dutch pages disagree about robinia: one gives December to February, another May
# to June, and a third late summer. They agree on the reason, which is that it
# bleeds once the sap is up, so the late-summer window is the one that follows
# from the shared reasoning rather than the one that reads best.

- genus: Robinia
  species: pseudoacacia
  names:
    nl: [Gewone robinia, Valse acacia, Acacia]
    en: [Black locust, False acacia]
  source: https://floraweb.nl/hoe-houd-je-robinia-compact-in-een-kleine-tuin-tips-en-trucs/
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/20170515Robinia%20pseudoacacia6.jpg?width=600
    author: AnRo0002
    licence: CC0
    page: https://commons.wikimedia.org/wiki/File:20170515Robinia_pseudoacacia6.jpg
  windows:
    - when: { start: "08-01", end: "09-15" }
      description:
        nl: >-
          Snoei in de late zomer. Wees niet bang om fors terug te snoeien: hij
          loopt krachtig weer uit. Wil je hem klein houden, snoei de kroon dan
          elk jaar strak terug tot op de hoofdtakken. Snoei niet in het voorjaar
          als de sapstroom op gang is, want dan bloedt hij flink. Vroeg in het
          voorjaar kan wel, maar dan vóór de bladuitloop in april.
        en: >-
          Prune in late summer. Do not be afraid to take it back hard: it comes
          away strongly. To keep it small, cut the crown back tight to the main
          branches every year. Do not prune in spring once the sap is up, because
          it bleeds heavily. Early spring does work, but before the leaves break
          in April.
  care:
    - when: { start: "04-01", end: "09-30" }
      description:
        nl: >-
          Robinia maakt wortelopslag: nieuwe loten die uit de wortels omhoog
          komen. Haal die er direct en volledig uit. Hak ze niet af, maar steek ze
          zo diep mogelijk uit, anders komen ze harder terug.
        en: >-
          Robinia throws root suckers, shoots coming up from the roots. Take them
          out promptly and completely. Do not chop them off; dig them out as deep
          as you can, or they come back harder.

# ------------------------------------------------------------------ Bamboo ---

# Fargesia's window is a reading in a different way from the others: the source
# offers three periods, end of winter, August to September, and autumn into early
# winter. This row presents the first, which is when winter-killed canes can come
# out, and the description says the late-summer option also works.

- genus: Fargesia
  species: murielae
  names:
    nl: [Bamboe, Schermbamboe]
    en: [Umbrella bamboo]
  source: https://www.gardenersworldmagazine.nl/groene-school/snoeien/bamboe-snoeien/
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/2009-07-31%20(35)%20Bamboo%2C%20Bambus%2C%20Fargesia%20murielae.JPG?width=600
    author: Vera Buhl
    licence: CC BY-SA 3.0
    page: https://commons.wikimedia.org/wiki/File:2009-07-31_(35)_Bamboo%2C_Bambus%2C_Fargesia_murielae.JPG
  windows:
    - when: { start: "03-01", end: "04-15" }
      description:
        nl: >-
          Snoeien hoeft eigenlijk niet: deze bamboe woekert niet en houdt zichzelf
          netjes. Wil je toch, dun dan aan het einde van de winter uit: haal de
          oudste en dunste halmen zo laag mogelijk weg, en de halmen die de winter
          niet gehaald hebben. Moet hij flink terug, verdeel dat dan over twee
          jaar; na een harde snoei herstelt hij langzaam. Augustus en september
          kan ook.
        en: >-
          It does not really need pruning: this bamboo does not run and keeps
          itself tidy. If you want to, thin it at the end of winter: take the
          oldest and thinnest canes out as low as you can, along with any the
          winter killed. If it needs taking back hard, spread that over two years;
          after a hard cut it recovers slowly. August and September also work.

# ------------------------------------------------------- Not hardy outdoors ---
# These two overwinter under cover, so their calendar follows when you bring them
# in and out rather than the Dutch outdoor year. The pruning months are a reading
# of what the sources say, not a citation: neither names a month.
#
# How far back the pelargonium goes is cited, but to a second page,
# gardenersworldmagazine.nl/groene-school/kweken/geraniums-overwinteren, which takes
# it back by about a third. The source cited on the row only says to leave green
# with good eyes on it. Anisodontea keeps no number because none of its sources
# gives one: it is cut to the shape you want, which is the answer for a plant grown
# as a standard.

- genus: Pelargonium
  species: peltatum
  names:
    nl: [Hanggeranium, Geranium]
    en: [Ivy-leaved geranium]
  source: https://www.directplant.nl/tuintips/geranium-verzorging/
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/A%20pink%20Pelargonium%20peltatum%20flower%20and%20plant.jpg?width=600
    author: Bobjgalindo
    licence: CC BY 4.0
    page: https://commons.wikimedia.org/wiki/File:A_pink_Pelargonium_peltatum_flower_and_plant.jpg
  windows:
    - when: { start: "03-01", end: "04-15" }
      description:
        nl: >-
          Niet winterhard: hij overwintert vorstvrij en licht, met weinig water.
          Knip hem met ongeveer een derde terug voordat hij naar binnen gaat of in
          het voorjaar bij het verpotten, dus twee derde van elke steel blijft
          staan. Laat altijd wat groen met goede ogen staan, want daaruit komen de
          nieuwe scheuten. Veel snoei is niet nodig; lange uitlopers mogen eraf.
        en: >-
          Not hardy: it overwinters frost-free and bright, with little water. Cut
          it back by about a third before it comes indoors or in spring when you
          repot it, so two thirds of each stem stays. Always leave some green with
          good eyes on it, because that is where the new shoots come from. It
          needs little pruning; long trailers can come off.
  care:
    - when: { start: "05-01", end: "09-30" }
      description:
        nl: >-
          Breek uitgebloeide bloemen uit de plant, met het steeltje eronder mee.
          Dan blijft hij nieuwe knoppen maken.
        en: >-
          Pull the spent flowers out of the plant, taking the little stalk under
          them with it. That keeps it setting new buds.

- genus: Anisodontea
  species: capensis
  names:
    nl: [Kamermalva, Kaapse malva]
    en: [Cape mallow]
  source: https://www.tuinadvies.nl/plantengids/1444/anisodontea-capensis
  image:
    url: https://commons.wikimedia.org/wiki/Special:FilePath/Anisodontea%20capensis3.jpg?width=600
    author: Qumarchi
    licence: CC BY-SA 4.0
    page: https://commons.wikimedia.org/wiki/File:Anisodontea_capensis3.jpg
  windows:
    - when: { start: "03-01", end: "04-15" }
      description:
        nl: >-
          Niet winterhard: haal hem binnen zodra het onder de vijf graden zakt en
          overwinter hem licht bij vijf à tien graden, met zeer matig water en
          geen mest. Hij kan veel snoei verdragen en laat zich in vorm houden,
          ook op stam, dus snoei hem in het voorjaar terug in de vorm die je wil.
        en: >-
          Not hardy: bring it in as soon as it drops below five degrees and
          overwinter it bright at five to ten degrees, watered very sparingly and
          not fed. It takes a lot of pruning and holds a shape, including as a
          standard, so cut it back to the shape you want in spring.
  care:
    - when: { start: "04-01", end: "10-31" }
      description:
        nl: >-
          Knip zaaddozen weg, dan gaat de energie naar nieuwe bloemen. Zitten er
          veel aan, dan mag je de takken diep terugknippen; daarna bloeit hij
          snel weer rijk.
        en: >-
          Cut the seed pods off so the energy goes into new flowers. If there are
          a lot of them, the branches can be cut back deeply; it soon flowers
          freely again.
