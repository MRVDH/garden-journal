name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      # Running the same script a developer runs, so CI and local cannot drift.
      - run: scripts/setup
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: scripts/setup
      - run: .venv/bin/pytest

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  dataset:
    name: Validate dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: scripts/setup
      - run: .venv/bin/python scripts/validate.py
      # Reads the committed PNGs, so it needs no rasteriser. Shares this job
      # rather than getting its own, since both check committed assets and a
      # separate job would spend a minute on setup to run for a second.
      - run: .venv/bin/python scripts/check_icon.py

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  # A release is the tag plus the version inside manifest.json, and HACS shows
  # the manifest version as the installed one. They have to agree, so a
  # mismatched tag fails here rather than shipping a wrong version number.
  version:
    name: Tag matches manifest
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/garden_journal/manifest.json'))['version'])")
          echo "tag=$tag manifest=$manifest"
          test "$tag" = "$manifest"
